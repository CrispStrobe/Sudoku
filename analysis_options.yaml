# Static analysis config. `flutter analyze` runs this in CI and must stay clean.
#
# Baseline is the recommended Flutter lint set; the additions below were turned
# on deliberately and the whole tree fixed to satisfy them in one pass.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Implicit dynamic casts are how a malformed JSON payload turns into a
    # confusing failure far from its source — make them explicit at the decode
    # site instead, where the surrounding try/catch can report it.
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # `const` where it is possible: fewer allocations, and const widgets are
    # skipped wholesale when Flutter diffs the tree.
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - unnecessary_parenthesis
    - avoid_redundant_argument_values
    # A dropped Future is a silently swallowed error; make the intent explicit
    # with `await` or `unawaited(...)`.
    - unawaited_futures
