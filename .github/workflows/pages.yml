# GitHub Pages: publishes the web build to crispstrobe.github.io/Sudoku/ on each
# release tag, so the Pages site tracks releases rather than the tip of main.
#
# Vercel (see deploy.sh) remains the primary web host; this is a second, free
# mirror served straight from the repo.
#
# Pages serves the site from a subpath, so the build needs --base-href /Sudoku/
# — without it every asset URL resolves against the domain root and the app
# loads to a blank page.

name: Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deploy in flight, but only run one at a time.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.4' # keep in step with ci.yml and release.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --base-href /Sudoku/ \
            --dart-define=APP_VERSION=${{ github.ref_name }}

      # Pages has no SPA rewrite rule: an unknown path 404s instead of falling
      # back to the app shell. Serving index.html as the 404 page gives the
      # Flutter router the same deep-link behaviour Vercel's rewrite provides.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Pages used to deploy and stop there, which is a gap Vercel does not have:
  # this site is the one served from a subpath, so it carries a failure mode
  # all of its own. A build made without the right --base-href serves every
  # byte with a 200 and still loads to a blank page, because each asset URL
  # resolves against the domain root instead of /Sudoku/.
  #
  # Note the doubled `assets/`: a bundled asset declared in pubspec as
  # `assets/x.json` is served at `<base>/assets/assets/x.json`.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke-check the deployment
        env:
          SITE: ${{ needs.deploy.outputs.url }}
        run: |
          base="${SITE%/}"
          echo "checking $base"
          for path in / /main.dart.js /flutter_bootstrap.js                       /assets/AssetManifest.bin.json                       /assets/assets/killer_puzzles.json                       /assets/assets/thermo_puzzles.json                       /assets/assets/kenken_puzzles.json                       /assets/assets/ready_puzzles.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$base$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          # A 200 is not enough for a puzzle bundle: an empty or truncated one
          # still 200s, and for KenKen that means an empty grid rather than a
          # harder puzzle, since 89 of its 96 boards carry no givens.
          curl -sL "$base/assets/assets/kenken_puzzles.json"             | python3 -c 'import json,sys; d=json.load(sys.stdin); n=sum(len(v) for v in d.values()); print(f"kenken bundle: {n} puzzles in {len(d)} configurations"); sys.exit(0 if n >= 32 and len(d) == 16 else 1)'
