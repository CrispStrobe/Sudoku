<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sudoku">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CrispSudoku</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Guard against a browser locale that is not a language tag.
    //
    // A container, a CI runner, or a Linux box with no LANG set reports the
    // bare POSIX locale `C`. The browser's own Intl API rejects it —
    // `new Intl.DateTimeFormat('C')` throws `RangeError: Invalid language
    // tag: C` — and the Flutter engine reads navigator.language during
    // startup, so the app died before painting a single frame: a blank white
    // page, with every asset served and a 200 on every request.
    //
    // This has to run before flutter_bootstrap.js, and it has to be here
    // rather than in Dart: by the time any Dart code runs, the engine has
    // already read the value. Rewrite anything Intl will not accept to a tag
    // it will, and leave every real locale untouched.
    (function () {
      function usable(tag) {
        try {
          return typeof tag === 'string' &&
                 Intl.getCanonicalLocales(tag).length > 0;
        } catch (e) {
          return false;
        }
      }
      var fallback = 'en-US';
      var languages = (navigator.languages || []).filter(usable);
      var language = usable(navigator.language) ? navigator.language : null;
      if (language === null || languages.length === 0) {
        if (!language) language = languages[0] || fallback;
        if (languages.length === 0) languages = [language];
        try {
          Object.defineProperty(navigator, 'language', {
            get: function () { return language; },
            configurable: true,
          });
          Object.defineProperty(navigator, 'languages', {
            get: function () { return languages; },
            configurable: true,
          });
          console.warn(
            'CrispSudoku: browser reported an unusable locale; using ' +
            language + '.');
        } catch (e) {
          // Non-configurable in some engine; nothing more we can do here, and
          // the Dart-side localeResolutionCallback still guards the UI.
        }
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
